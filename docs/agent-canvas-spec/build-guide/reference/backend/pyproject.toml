[project]
name = "agentcanvas"
version = "0.1.0"
requires-python = ">=3.12"
# Versions verified together on 2026-09-28 (see build-guide/01-environment-setup.md)
dependencies = [
  "langgraph>=1.2.12,<1.3",
  "langchain>=1.4.2,<1.5",
  "langchain-core>=1.2",
  "deepagents>=0.7.19,<0.8",
  "langgraph-checkpoint-postgres>=3.1",
  "psycopg[binary,pool]>=3.2",
  "fastapi>=0.141",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "jinja2>=3.1",
  "cel-python>=0.4",
  "ruff>=0.9",  # used at runtime by the code generator (ruff format)
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcanvas"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "BLE", "PLW"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
include = ["agentcanvas"]
typeCheckingMode = "standard"
